# Example risk configuration.
#
# Prices and notionals are decimals in the quote currency; they are converted
# to fixed point (1/10,000) at load time. A limit of 0 means "no limit".

[engine]
max_orders = 65536                 # live orders tracked at once
max_cl_ord_ids = 1048576           # ClOrdIDs remembered for duplicate detection
max_symbols = 4096
max_accounts = 256
max_positions = 65536
allow_unconfigured_symbols = true  # unknown symbols get [symbol_defaults]
allow_unconfigured_accounts = true
allow_market_orders = false
fills_update_reference = true      # last fill price becomes the collar reference
self_trade_prevention = true
kill_switch_reject_threshold = 50  # trip after 50 rejects ...
kill_switch_window_ms = 1000       # ... inside one second

[symbol_defaults]
max_order_qty = 10000
max_order_notional = 1000000
max_position = 50000
price_band_bps = 500               # reject limit prices > 5% from reference
require_reference_price = true

[account_defaults]
max_open_orders = 500
max_open_notional = 10000000
orders_per_second = 200
burst = 50

[symbol AAPL]
reference_price = 150.00

[symbol MSFT]
reference_price = 420.00
max_order_qty = 5000

[symbol GME]
restricted = true

[account DESK1]
max_open_notional = 25000000
orders_per_second = 500
burst = 100
